<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>封装_简易axios函数_注册用户</title>
</head>

<body>
  <button class="reg-btn">注册用户</button>
  <p></p>
  <script>
    /**
     * 目标：封装_简易axios函数_注册用户
     *  1. 判断有data选项，携带请求体
     *  2. 转换数据类型，在send中发送
     *  3. 使用myAxios函数，完成注册用户
    */
    function myAxios(config) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest()

        if (config.params) {
          const paramsObj = new URLSearchParams(config.params)
          const queryString = paramsObj.toString()
          config.url += `?${queryString}`
        }
        xhr.open(config.method || 'GET', config.url)

        xhr.addEventListener('loadend', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(JSON.parse(xhr.response))
          } else {
            // 修复问题1：先解析JSON字符串为JS对象，再直接reject，去掉Error包装
            try {
              const errorObj = JSON.parse(xhr.response)
              reject(errorObj) // 直接抛出解析后的纯JS错误对象
            } catch {
              // 兼容非JSON响应，保留原始Error包装逻辑
              reject(new Error(xhr.response))
            }
          }
        })
        if (config.data) {
          xhr.setRequestHeader('Content-Type', 'application/json')
          xhr.send(JSON.stringify(config.data))
        } else {
          //如果没有请求体，就正常的发送请求
          xhr.send()
        }

      })
    }

    document.querySelector('.reg-btn').addEventListener('click', () => {
      myAxios({
        url: 'http://hmajax.itheima.net/api/register',
        method: 'POST',
        data: {
          username: 'maomao123',
          password: '1234567'
        }
      }).then((result) => {
        console.log(result);
        document.querySelector('p').innerHTML = result.message
      }).catch((err) => {
        console.log(err);
        document.querySelector('p').innerHTML = err.message
      });

    })

  </script>
</body>

</html>
