<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    {{nickname}}
    <br />
    {{nickname.toUpperCase()}}
    <br />
    {{nickname+'你好'}}
    <br />
    {{age>=18?'成年了':'未成年'}}
    <br />
    {{friend.name+friend.log}}



  </div>

  <script src="./vue.js"></script>

  <script>
    const app = new Vue({
      el: '#app',
      data: {
        nickname: 'xiaoming',
        age: 18,
        friend: {
          name: 'liming',
          log: '热爱学习Vue',

        }
      }
    })



  </script>

</body>

</html>
