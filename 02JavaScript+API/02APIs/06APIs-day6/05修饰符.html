<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    console.log(/a/.test('A'));
    // false, 区分大小写

    console.log(/a/i.test('A'));
    // true, i表示忽略大小写

    const str = 'java是一门编程语言,学完JAVA可以开发很多东西';
    const newStr = str.replace(/JAVA/ig, '前端');
    console.log(newStr);
  </script>
</body>

</html>
