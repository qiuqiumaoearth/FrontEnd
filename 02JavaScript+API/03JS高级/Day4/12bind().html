<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const obj = {
      uname: 'pink'
    }
    function fn() {
      console.log(this);
    }

    //1.bind 不会调用函数
    //2.能改变this的指向
    //3.返回值是个函数,但是这个函数里面的this是更改过obj的
    const fun = fn.bind(obj)
    fun()
    //obj uname:'pink'
  </script>
</body>

</html>
