<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
  </ul>

  <script>
    const lis = document.querySelectorAll('li')
    //此时lis是一个伪数组,无法怎删改查
    const liss = Array.from(lis)
    console.log(liss); //[li, li, li]
    liss.pop()
    console.log(liss); //[li, li, li]
  </script>

</body>

</html>
