<body>
  <script>
    const obj1 = {
      name: 'outer',
      inner: {
        name: 'inner',
        say: () => {
          console.log(this.name); // 这里的 this 是什么？window
        }
      }
    };

    obj1.inner.say(); // 输出什么？空


    const name1 = 'global';
    const say = () => console.log(this.name1);
    const obj2 = {
      name: 'outer',
      inner: {
        name: 'inner',
        say
      }
    }

    obj2.inner.say(); // 输出什么？ 空

    var name = 'global';
    const say1 = () => console.log(this.name);
    const obj3 = {
      name: 'outer',
      inner: {
        name: 'inner',
        say1
      }
    }

    obj3.inner.say1(); // 输出什么？

  </script>
</body>
