<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let i = 0
    function fn() {
      i++
      console.log('函数被调用', i, '次');
    }
    fn()
    //i是全局变量,很容易被修改

    //闭包的应用:统计函数被调用的次数
    function bn() {
      let i = 0
      function tj() {
        i++
        console.log(`闭包情况下统计函数被调用了${i}次`);
      }
      return tj
    }
    const count = bn()

  </script>
</body>

</html>
